<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="集刷题、不熟单词收集与艾宾浩斯复习于一体的雅思备考工作台">
  <title>雅思备考工作台</title>
  <style>
    :root {
      --blue-950: #102a56;
      --blue-900: #163568;
      --blue-800: #1b4c91;
      --blue-700: #2364c4;
      --blue-600: #2f78e2;
      --blue-500: #4a8df0;
      --blue-100: #eaf3ff;
      --blue-50: #f5f9ff;
      --ink-900: #162033;
      --ink-700: #3d4b63;
      --ink-500: #748096;
      --line: #e3eaf4;
      --surface: #ffffff;
      --canvas: #f3f7fc;
      --danger: #e94b4b;
      --danger-dark: #cf3636;
      --danger-soft: #fff0f0;
      --orange: #ff6b35;
      --success: #19a974;
      --shadow-sm: 0 5px 18px rgba(22, 53, 104, 0.08);
      --shadow-md: 0 16px 42px rgba(22, 53, 104, 0.14);
      --radius-lg: 20px;
      --radius-md: 14px;
      --sidebar-width: 248px;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink-900);
      background: var(--canvas);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      border: 0;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(74, 141, 240, 0.32);
      outline-offset: 3px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      grid-column: 1;
      grid-row: 1;
      flex-direction: column;
      height: 100vh;
      padding: 28px 20px 22px;
      color: #fff;
      background:
        radial-gradient(circle at 20% 0%, rgba(93, 159, 255, 0.28), transparent 32%),
        linear-gradient(178deg, var(--blue-950), var(--blue-900));
    }

    .brand {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 8px 30px;
    }

    .brand-mark {
      position: relative;
      display: grid;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      padding: 0;
      overflow: visible;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-size: 23px;
      font-weight: 800;
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .brand-mark:hover {
      border-color: rgba(255, 255, 255, 0.52);
      box-shadow: 0 7px 18px rgba(3, 17, 43, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .brand-mark:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .avatar-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 13px;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-fallback {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
    }

    .avatar-edit-badge {
      position: absolute;
      right: -5px;
      bottom: -5px;
      display: grid;
      width: 19px;
      height: 19px;
      place-items: center;
      border: 2px solid var(--blue-950);
      border-radius: 50%;
      color: #fff;
      background: var(--orange);
      font-size: 9px;
      line-height: 1;
    }

    .brand-copy {
      min-width: 0;
    }

    .workspace-name-row {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
    }

    .workspace-name-field {
      display: block;
      min-width: 0;
      max-width: 148px;
      margin: -3px 0 -3px -5px;
      padding: 3px 5px;
      overflow: hidden;
      border-radius: 6px;
      cursor: text;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      line-height: 1.3;
      letter-spacing: 0.02em;
    }

    .workspace-name-field:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .workspace-name-field:focus {
      overflow: visible;
      outline: 2px solid rgba(255, 255, 255, 0.38);
      background: rgba(255, 255, 255, 0.12);
      text-overflow: clip;
    }

    .name-edit-icon {
      flex: 0 0 auto;
      color: rgba(255, 255, 255, 0.48);
      font-size: 10px;
      pointer-events: none;
    }

    .brand-subtitle {
      display: block;
      margin-top: 4px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .side-nav {
      display: grid;
      gap: 10px;
    }

    .nav-button {
      display: flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      border: 1px solid transparent;
      border-radius: 13px;
      color: rgba(255, 255, 255, 0.72);
      background: transparent;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease, border-color 160ms ease;
    }

    .nav-button:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-button:active {
      transform: scale(0.985);
    }

    .nav-button.active {
      border-color: rgba(255, 255, 255, 0.09);
      color: #fff;
      background: linear-gradient(135deg, rgba(74, 141, 240, 0.48), rgba(74, 141, 240, 0.2));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .nav-icon {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.09);
      font-size: 15px;
    }

    .nav-button.active .nav-icon {
      background: rgba(255, 255, 255, 0.16);
    }

    .nav-label {
      font-size: 14px;
      font-weight: 650;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 18px 12px 3px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      line-height: 1.7;
    }

    .sidebar-footer strong {
      display: block;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
      font-weight: 600;
    }

    .main-content {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
      min-height: 100vh;
    }

    .view {
      display: none;
      min-height: 100vh;
    }

    .view.active {
      display: block;
      animation: view-in 220ms ease both;
    }

    @keyframes view-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 刷题入口 */
    .practice-view {
      position: relative;
      height: 100vh;
      padding: 22px;
      overflow: hidden;
    }

    .practice-panel {
      display: flex;
      height: 100%;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .practice-toolbar {
      display: flex;
      flex: 0 0 auto;
      min-height: 66px;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 11px 18px 11px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
    }

    .page-heading {
      min-width: 0;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    .page-heading p {
      margin: 5px 0 0;
      color: var(--ink-500);
      font-size: 12px;
    }

    .practice-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .copy-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-500);
      font-size: 11px;
      white-space: nowrap;
    }

    .copy-hint kbd {
      padding: 3px 6px;
      border: 1px solid #d8e2ef;
      border-bottom-width: 2px;
      border-radius: 6px;
      color: var(--blue-800);
      background: #fff;
      box-shadow: 0 1px 2px rgba(22, 53, 104, 0.05);
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
    }

    .external-link {
      display: inline-flex;
      flex: 0 0 auto;
      min-height: 38px;
      align-items: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid #d8e5f7;
      border-radius: 10px;
      color: var(--blue-700);
      background: var(--blue-50);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .external-link:hover {
      border-color: #b9d2f4;
      background: var(--blue-100);
    }

    .external-link:active {
      transform: translateY(1px);
    }

    .external-link.add-word-button {
      border-color: #ffd2bf;
      color: #cf4d1e;
      background: #fff5f0;
    }

    .external-link.add-word-button:hover {
      border-color: #f6b79d;
      background: #ffe9df;
    }

    .practice-frame-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: #fff;
    }

    .practice-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .frame-loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      color: var(--blue-700);
      background:
        radial-gradient(circle at 50% 35%, rgba(74, 141, 240, 0.13), transparent 32%),
        var(--blue-50);
      font-size: 14px;
      font-weight: 700;
      pointer-events: none;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .frame-loading.loaded {
      opacity: 0;
      visibility: hidden;
    }

    .practice-launcher {
      display: grid;
      flex: 1 1 auto;
      min-height: 0;
      place-items: center;
      overflow: auto;
      padding: clamp(24px, 5vw, 64px);
      background:
        radial-gradient(circle at 20% 18%, rgba(88, 150, 238, 0.18), transparent 34%),
        radial-gradient(circle at 86% 78%, rgba(255, 132, 82, 0.13), transparent 31%),
        var(--blue-50);
    }

    .launch-card {
      position: relative;
      width: 100%;
      max-width: 820px;
      padding: clamp(28px, 5vw, 52px);
      overflow: hidden;
      border: 1px solid rgba(189, 213, 245, 0.9);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 24px 70px rgba(31, 76, 139, 0.14);
      text-align: center;
    }

    .launch-card::before {
      position: absolute;
      top: -74px;
      right: -58px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(69, 132, 224, 0.08);
      content: "";
    }

    .launch-badge {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      padding: 0 12px;
      border: 1px solid #cfe0f8;
      border-radius: 999px;
      color: var(--blue-700);
      background: var(--blue-50);
      font-size: 12px;
      font-weight: 750;
    }

    .launch-card h2 {
      margin: 18px 0 9px;
      color: var(--blue-950);
      font-size: clamp(26px, 4vw, 40px);
      letter-spacing: -0.035em;
    }

    .launch-description {
      max-width: 620px;
      margin: 0 auto;
      color: var(--ink-500);
      font-size: 15px;
      line-height: 1.75;
    }

    .launch-primary {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 24px;
      padding: 0 24px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue-700), #4285e5);
      box-shadow: 0 12px 28px rgba(35, 100, 196, 0.28);
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .launch-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(35, 100, 196, 0.34);
    }

    .launch-primary:active {
      transform: translateY(0);
    }

    .launch-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 30px;
      text-align: left;
    }

    .launch-step {
      padding: 16px;
      border: 1px solid #e1eaf6;
      border-radius: 15px;
      background: #fbfdff;
    }

    .launch-step-number {
      display: grid;
      width: 27px;
      height: 27px;
      margin-bottom: 10px;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      background: var(--blue-700);
      font-size: 12px;
      font-weight: 800;
    }

    .launch-step strong {
      display: block;
      margin-bottom: 5px;
      color: var(--ink-900);
      font-size: 13px;
    }

    .launch-step p {
      margin: 0;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.55;
    }

    .privacy-note {
      margin: 20px 0 0;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.55;
    }

    .bookmarklet-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      margin-top: 22px;
      padding: 18px;
      border: 1px dashed #b9d2f4;
      border-radius: 17px;
      background: #f4f8ff;
      text-align: left;
    }

    .bookmarklet-copy {
      min-width: 0;
    }

    .bookmarklet-copy strong {
      display: block;
      color: var(--blue-950);
      font-size: 14px;
    }

    .bookmarklet-copy p {
      margin: 5px 0 0;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.6;
    }

    .bookmarklet-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bookmarklet-button,
    .bookmarklet-copy-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .bookmarklet-button {
      padding: 0 14px;
      border: 1px solid #f6b79d;
      color: #c94718;
      background: #fff;
      box-shadow: 0 5px 14px rgba(207, 77, 30, 0.1);
      cursor: grab;
      text-decoration: none;
    }

    .bookmarklet-button:active {
      cursor: grabbing;
    }

    .bookmarklet-copy-button {
      padding: 0 11px;
      border: 1px solid #cfe0f8;
      color: var(--blue-700);
      background: #fff;
      cursor: pointer;
    }

    .bookmarklet-tip {
      grid-column: 1 / -1;
      margin: -4px 0 0;
      color: var(--ink-500);
      font-size: 10px;
      line-height: 1.55;
    }

    .floating-add {
      position: fixed;
      right: 34px;
      bottom: 32px;
      z-index: 15;
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, #ff7745, #ed4e22);
      box-shadow: 0 13px 30px rgba(237, 78, 34, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .floating-add:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 17px 34px rgba(237, 78, 34, 0.41), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .floating-add:active {
      transform: translateY(0) scale(0.97);
    }

    .plus-icon {
      display: block;
      margin-top: -3px;
      font-size: 39px;
      font-weight: 300;
      line-height: 1;
    }

    .floating-add::after {
      position: absolute;
      right: 72px;
      width: max-content;
      padding: 7px 10px;
      border-radius: 8px;
      color: #fff;
      background: rgba(16, 42, 86, 0.92);
      content: "粘贴并收录单词";
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(6px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .floating-add:hover::after {
      opacity: 1;
      transform: translateX(0);
    }

    /* 单词本 */
    .vocabulary-view {
      padding: 34px clamp(22px, 4vw, 62px) 60px;
    }

    .vocab-container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .vocab-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      color: var(--blue-700);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 22px;
      height: 2px;
      border-radius: 99px;
      background: var(--blue-600);
      content: "";
    }

    .vocab-header h1 {
      margin: 0;
      font-size: clamp(25px, 3vw, 34px);
      letter-spacing: -0.035em;
    }

    .vocab-header p {
      margin: 9px 0 0;
      color: var(--ink-500);
      font-size: 14px;
    }

    .header-stat {
      display: flex;
      flex: 0 0 auto;
      gap: 12px;
    }

    .stat-block {
      min-width: 92px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 3px 12px rgba(22, 53, 104, 0.04);
    }

    .stat-block span {
      display: block;
      color: var(--ink-500);
      font-size: 11px;
    }

    .stat-block strong {
      display: block;
      margin-top: 3px;
      color: var(--blue-900);
      font-size: 21px;
      line-height: 1;
    }

    .wordbook-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .wordbook-search {
      padding: 20px 20px 0;
      background: linear-gradient(180deg, var(--blue-50), #fff);
    }

    .search-shell {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      z-index: 1;
      color: var(--blue-600);
      font-size: 17px;
      pointer-events: none;
    }

    .source-search-input {
      width: 100%;
      min-height: 48px;
      padding: 0 46px 0 44px;
      border: 1px solid #cfddf0;
      border-radius: 13px;
      color: var(--ink-900);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 5px 16px rgba(22, 53, 104, 0.06);
      font-size: 14px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .source-search-input:focus {
      border-color: var(--blue-500);
      outline: 0;
      box-shadow: 0 0 0 4px rgba(74, 141, 240, 0.12);
    }

    .source-search-input::placeholder {
      color: #98a5b8;
    }

    .clear-search {
      position: absolute;
      right: 8px;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 9px;
      color: var(--ink-500);
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }

    .clear-search:hover {
      color: var(--blue-800);
      background: var(--blue-100);
    }

    .search-summary {
      min-height: 25px;
      margin: 7px 2px 0;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.5;
    }

    .search-summary strong {
      color: var(--blue-800);
    }

    .wordbook-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .category-tabs {
      display: inline-flex;
      padding: 4px;
      border-radius: 12px;
      background: #edf3fb;
    }

    .tab-button {
      min-width: 100px;
      min-height: 38px;
      padding: 0 18px;
      border-radius: 9px;
      color: var(--ink-500);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .tab-button.active {
      color: var(--blue-800);
      background: #fff;
      box-shadow: 0 3px 10px rgba(22, 53, 104, 0.1);
    }

    .review-button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      gap: 8px;
      padding: 0 17px;
      border-radius: 11px;
      color: #fff;
      background: var(--blue-700);
      box-shadow: 0 7px 16px rgba(35, 100, 196, 0.2);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .review-button:hover {
      background: var(--blue-800);
      box-shadow: 0 9px 19px rgba(35, 100, 196, 0.26);
      transform: translateY(-1px);
    }

    .review-button.active {
      color: var(--blue-800);
      background: var(--blue-100);
      box-shadow: none;
    }

    .word-list {
      display: grid;
      gap: 14px;
      padding: 20px;
    }

    .word-list.grouped-list {
      gap: 24px;
      background: #fbfdff;
    }

    .source-group {
      min-width: 0;
    }

    .source-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
      padding: 0 4px;
    }

    .source-group-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: var(--blue-950);
      font-size: 15px;
      font-weight: 800;
    }

    .source-group-title::before {
      width: 4px;
      height: 18px;
      border-radius: 99px;
      background: var(--blue-600);
      content: "";
    }

    .source-group-count {
      color: var(--ink-500);
      font-size: 11px;
    }

    .source-card-list {
      display: grid;
      gap: 12px;
    }

    .word-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(150px, 0.85fr) minmax(220px, 1.5fr) minmax(210px, 0.9fr);
      align-items: center;
      gap: 22px;
      min-height: 118px;
      padding: 22px 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .word-card:hover {
      border-color: #cbdaf0;
      box-shadow: 0 10px 24px rgba(22, 53, 104, 0.07);
      transform: translateY(-1px);
    }

    .word-card.due {
      border-color: #f2bcbc;
      background: linear-gradient(96deg, #fff2f2, #fff9f9);
    }

    .word-card.due::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: var(--danger);
      content: "";
    }

    .word-main {
      min-width: 0;
    }

    .word-main h2 {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--blue-950);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      letter-spacing: -0.015em;
    }

    .word-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 11px;
    }

    .badge {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      color: var(--blue-700);
      background: var(--blue-100);
      font-size: 11px;
      font-weight: 750;
    }

    .badge.due-label {
      color: #b82f2f;
      background: #ffdede;
    }

    .badge.source-label {
      color: #6e4b12;
      background: #fff1ce;
    }

    .meaning {
      min-width: 0;
      color: var(--ink-700);
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card-dates {
      display: grid;
      gap: 10px;
      padding-left: 20px;
      border-left: 1px solid rgba(116, 128, 150, 0.17);
    }

    .date-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.5;
    }

    .date-row strong {
      color: var(--ink-700);
      font-weight: 650;
    }

    .empty-state {
      display: grid;
      min-height: 310px;
      place-items: center;
      padding: 52px 20px;
      text-align: center;
    }

    .empty-state-icon {
      display: grid;
      width: 70px;
      height: 70px;
      margin: 0 auto 17px;
      place-items: center;
      border-radius: 22px;
      background: var(--blue-100);
      font-size: 31px;
    }

    .empty-state h2 {
      margin: 0;
      color: var(--blue-950);
      font-size: 18px;
    }

    .empty-state p {
      max-width: 410px;
      margin: 10px auto 0;
      color: var(--ink-500);
      font-size: 13px;
      line-height: 1.7;
    }

    /* 复习翻转卡片 */
    .review-grid {
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      padding: 24px;
    }

    .flip-card {
      min-height: 260px;
      cursor: pointer;
      perspective: 1000px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 260px;
      transform-style: preserve-3d;
      transition: transform 500ms cubic-bezier(0.2, 0.72, 0.2, 1);
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
      border: 1px solid #f1c2c2;
      border-radius: 18px;
      background:
        radial-gradient(circle at 85% 12%, rgba(233, 75, 75, 0.09), transparent 24%),
        linear-gradient(145deg, #fff5f5, #fff);
      box-shadow: 0 12px 28px rgba(22, 53, 104, 0.08);
      text-align: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-back {
      border-color: #c4d9f7;
      background:
        radial-gradient(circle at 15% 12%, rgba(47, 120, 226, 0.12), transparent 24%),
        linear-gradient(145deg, #eff6ff, #fff);
      transform: rotateY(180deg);
    }

    .flip-prompt {
      position: absolute;
      bottom: 19px;
      color: var(--ink-500);
      font-size: 11px;
    }

    .flip-face h2 {
      max-width: 100%;
      margin: 12px 0 0;
      overflow-wrap: anywhere;
      color: var(--blue-950);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 3vw, 36px);
    }

    .flip-face .flip-meaning {
      max-width: 100%;
      margin-top: 12px;
      color: var(--ink-700);
      font-size: 17px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* 新增单词对话框 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      padding: 20px;
      place-items: center;
      visibility: hidden;
      background: rgba(10, 27, 55, 0.52);
      opacity: 0;
      backdrop-filter: blur(6px);
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .modal-backdrop.open {
      visibility: visible;
      opacity: 1;
    }

    .modal {
      width: min(510px, 100%);
      max-height: min(720px, calc(100vh - 40px));
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 26px 70px rgba(6, 22, 49, 0.28);
      opacity: 0;
      transform: translateY(14px) scale(0.985);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .modal-backdrop.open .modal {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 26px 19px;
      border-bottom: 1px solid var(--line);
    }

    .modal-header h2 {
      margin: 0;
      color: var(--blue-950);
      font-size: 21px;
      letter-spacing: -0.02em;
    }

    .modal-header p {
      margin: 7px 0 0;
      color: var(--ink-500);
      font-size: 12px;
    }

    .icon-button {
      display: grid;
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 10px;
      color: var(--ink-500);
      background: var(--blue-50);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      transition: color 160ms ease, background 160ms ease;
    }

    .icon-button:hover {
      color: var(--blue-900);
      background: var(--blue-100);
    }

    .modal-form {
      display: grid;
      gap: 19px;
      padding: 24px 26px 27px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--ink-700);
      font-size: 13px;
      font-weight: 700;
    }

    .field-label span {
      color: var(--ink-500);
      font-size: 11px;
      font-weight: 500;
    }

    .field-control {
      width: 100%;
      min-height: 46px;
      padding: 0 13px;
      border: 1px solid #d8e2f0;
      border-radius: 11px;
      color: var(--ink-900);
      background: #fbfdff;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .field-control:hover {
      border-color: #c0d1e7;
    }

    .field-control:focus {
      border-color: var(--blue-500);
      outline: 0;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(74, 141, 240, 0.12);
    }

    select.field-control {
      cursor: pointer;
    }

    textarea.field-control {
      min-height: 104px;
      padding-top: 12px;
      padding-bottom: 12px;
      line-height: 1.6;
      resize: vertical;
    }

    .input-with-action {
      position: relative;
    }

    .input-with-action .field-control {
      padding-right: 80px;
    }

    .paste-button {
      position: absolute;
      top: 6px;
      right: 6px;
      min-height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      color: var(--blue-700);
      background: var(--blue-100);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .paste-button:hover {
      background: #dcecff;
    }

    .clipboard-status {
      min-height: 16px;
      margin: -2px 0 0;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.45;
    }

    .clipboard-status.success {
      color: var(--success);
    }

    .clipboard-status.warning {
      color: #b36a15;
    }

    .translate-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
    }

    .translate-button {
      display: inline-flex;
      min-height: 39px;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      border: 1px solid #cadcf5;
      border-radius: 10px;
      color: var(--blue-700);
      background: var(--blue-50);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .translate-button:hover:not(:disabled) {
      border-color: #adcaf0;
      background: var(--blue-100);
    }

    .translate-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .spinner {
      display: none;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(35, 100, 196, 0.25);
      border-top-color: var(--blue-700);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    .translate-button.loading .spinner {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .save-button {
      width: 100%;
      min-height: 48px;
      margin-top: 2px;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue-700), var(--blue-600));
      box-shadow: 0 9px 21px rgba(35, 100, 196, 0.22);
      cursor: pointer;
      font-size: 14px;
      font-weight: 750;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .save-button:hover {
      box-shadow: 0 12px 25px rgba(35, 100, 196, 0.28);
      transform: translateY(-1px);
    }

    .save-button:active {
      box-shadow: 0 6px 14px rgba(35, 100, 196, 0.2);
      transform: translateY(1px);
    }

    /* 提示消息 */
    .toast-region {
      position: fixed;
      top: 22px;
      right: 24px;
      z-index: 200;
      display: grid;
      gap: 10px;
      width: min(360px, calc(100vw - 40px));
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 12px;
      color: #fff;
      background: rgba(19, 49, 95, 0.96);
      box-shadow: var(--shadow-md);
      font-size: 13px;
      font-weight: 650;
      opacity: 0;
      transform: translateY(-10px);
      animation: toast-in 220ms ease forwards, toast-out 220ms ease 2.75s forwards;
    }

    .toast.success {
      background: rgba(21, 146, 99, 0.97);
    }

    .toast.error {
      background: rgba(199, 49, 49, 0.97);
    }

    @keyframes toast-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toast-out {
      to {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    @media (max-width: 900px) {
      :root {
        --sidebar-width: 204px;
      }

      .word-card {
        grid-template-columns: minmax(140px, 0.8fr) 1.4fr;
      }

      .card-dates {
        grid-column: 1 / -1;
        grid-template-columns: 1fr 1fr;
        padding-top: 15px;
        padding-left: 0;
        border-top: 1px solid rgba(116, 128, 150, 0.17);
        border-left: 0;
      }
    }

    @media (max-width: 700px) {
      :root {
        --sidebar-width: 78px;
      }

      .app-shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        display: flex;
        height: 100vh;
        align-items: stretch;
        padding: 15px 8px;
        background: linear-gradient(178deg, var(--blue-950), var(--blue-900));
      }

      .brand {
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        padding: 0 0 22px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        font-size: 19px;
      }

      .avatar-frame {
        border-radius: 12px;
      }

      .brand-copy {
        display: block;
        width: 100%;
      }

      .workspace-name-row {
        justify-content: center;
      }

      .workspace-name-field {
        max-width: 78px;
        margin: 0;
        font-size: 11px;
        line-height: 1.35;
        text-align: center;
        white-space: normal;
      }

      .brand-subtitle,
      .name-edit-icon,
      .sidebar-footer {
        display: none;
      }

      .side-nav {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-left: 0;
      }

      .nav-button {
        min-height: 68px;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 7px 3px;
        border-radius: 10px;
      }

      .nav-icon {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        font-size: 13px;
      }

      .nav-label {
        font-size: 11px;
        line-height: 1.25;
        text-align: center;
      }

      .main-content,
      .view {
        min-height: 100vh;
      }

      .practice-view {
        height: 100vh;
        min-height: 520px;
        padding: 10px;
      }

      .practice-panel {
        border-radius: 15px;
      }

      .practice-toolbar {
        min-height: 58px;
        padding: 9px 11px 9px 14px;
      }

      .page-heading h1 {
        font-size: 15px;
      }

      .page-heading p {
        display: none;
      }

      .copy-hint {
        display: none;
      }

      .practice-actions {
        gap: 7px;
      }

      .external-link {
        min-height: 34px;
        padding: 0 10px;
        font-size: 11px;
      }

      .practice-frame-wrap {
        min-height: 0;
      }

      .practice-launcher {
        place-items: start center;
        padding: 16px 12px 88px;
      }

      .launch-card {
        padding: 24px 18px;
        border-radius: 20px;
      }

      .launch-card h2 {
        margin-top: 14px;
        font-size: 25px;
      }

      .launch-description {
        font-size: 13px;
      }

      .launch-primary {
        width: 100%;
        min-height: 48px;
        margin-top: 19px;
      }

      .launch-steps {
        grid-template-columns: 1fr;
        gap: 9px;
        margin-top: 20px;
      }

      .launch-step {
        display: grid;
        grid-template-columns: 30px 1fr;
        column-gap: 10px;
        padding: 12px;
      }

      .launch-step-number {
        grid-row: 1 / 3;
        margin: 0;
      }

      .bookmarklet-box {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 14px;
      }

      .bookmarklet-actions {
        display: grid;
        grid-template-columns: 1fr auto;
      }

      .bookmarklet-button {
        min-width: 0;
      }

      .floating-add {
        right: 16px;
        bottom: 20px;
        width: 58px;
        height: 58px;
      }

      .floating-add::after {
        display: none;
      }

      .vocabulary-view {
        padding: 25px 13px 38px;
      }

      .vocab-header {
        display: block;
        margin-bottom: 19px;
      }

      .vocab-header p {
        line-height: 1.6;
      }

      .header-stat {
        margin-top: 18px;
      }

      .stat-block {
        flex: 1;
      }

      .wordbook-search {
        padding: 14px 14px 0;
      }

      .source-search-input {
        min-height: 44px;
        font-size: 13px;
      }

      .wordbook-controls {
        align-items: stretch;
        flex-direction: column;
        padding: 14px;
      }

      .category-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .tab-button {
        min-width: 0;
      }

      .review-button {
        justify-content: center;
      }

      .word-list {
        gap: 12px;
        padding: 13px;
      }

      .word-card {
        display: block;
        min-height: 0;
        padding: 19px;
      }

      .meaning {
        margin-top: 17px;
      }

      .card-dates {
        display: grid;
        grid-template-columns: 1fr;
        margin-top: 18px;
        padding-top: 15px;
      }

      .review-grid {
        grid-template-columns: 1fr;
      }

      .modal-backdrop {
        align-items: end;
        padding: 0;
      }

      .modal {
        width: 100%;
        max-height: 92vh;
        border-radius: 22px 22px 0 0;
      }

      .modal-header,
      .modal-form {
        padding-right: 20px;
        padding-left: 20px;
      }

      .toast-region {
        top: 70px;
        right: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <button class="brand-mark" id="avatarButton" type="button" aria-label="更换个人头像" title="点击更换个人头像">
          <span class="avatar-frame">
            <span class="avatar-fallback" id="avatarFallback" aria-hidden="true">雅</span>
            <img class="avatar-image" id="avatarImage" alt="" hidden>
          </span>
          <span class="avatar-edit-badge" aria-hidden="true">✎</span>
        </button>
        <input id="avatarInput" type="file" accept="image/*" hidden>
        <div class="brand-copy">
          <div class="workspace-name-row" title="点击名称即可修改">
            <strong
              class="workspace-name-field"
              id="workspaceNameText"
              contenteditable="true"
              role="textbox"
              aria-label="自定义工作台名称"
              aria-multiline="false"
              spellcheck="false"
            >雅思备考工作台</strong>
            <span class="name-edit-icon" aria-hidden="true">✎</span>
          </div>
          <span class="brand-subtitle">IELTS WORKSPACE</span>
        </div>
      </div>

      <nav class="side-nav">
        <button class="nav-button active" type="button" data-view-target="practice" aria-current="page">
          <span class="nav-icon" aria-hidden="true">✎</span>
          <span class="nav-label">刷题入口</span>
        </button>
        <button class="nav-button" type="button" data-view-target="vocabulary">
          <span class="nav-icon" aria-hidden="true">Aa</span>
          <span class="nav-label">单词本</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <strong id="todayLabel">今天</strong>
        每天进步一点，稳定比完美更重要。
      </div>
    </aside>

    <main class="main-content">
      <section class="view practice-view active" id="practiceView" aria-labelledby="practiceTitle">
        <div class="practice-panel">
          <header class="practice-toolbar">
            <div class="page-heading">
              <h1 id="practiceTitle">刷题入口</h1>
              <p>题库已放进工作台；复制生词后，直接点击右下角橙色“+”收录</p>
            </div>

              <span class="copy-hint">
                选词并按 <kbd>⌘ C</kbd>，再点“+”

                class="external-link"

                data-practice-link
              >
                新窗口打开 <span aria-hidden="true">↗</span>
              </a>
            </div>
          </header>
          <div class="practice-frame-wrap">
            <div class="frame-loading" id="practiceFrameLoading">正在加载新东方雅思题库…</div>
            <iframe
              class="practice-frame"
              id="practiceFrame"
              src="https://ieltscat.xdf.cn/?dt_dapp=1"
              title="新东方雅思题库"
              allow="clipboard-read; clipboard-write; autoplay; fullscreen"
              referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>
          </div>

        <button class="floating-add" id="openAddModal" type="button" aria-label="粘贴并收录单词">

        </button>

      <section class="view vocabulary-view" id="vocabularyView" aria-labelledby="vocabularyTitle">
        <div class="vocab-container">
          <header class="vocab-header">
            <div>
              <div class="eyebrow">Vocabulary Notebook</div>
              <h1 id="vocabularyTitle">单词本</h1>
              <p>按照艾宾浩斯节奏复习，把短暂记忆变成长期积累。</p>
            </div>
            <div class="header-stat" aria-label="单词统计">
              <div class="stat-block">
                <span>已收录</span>
                <strong id="totalWordCount">0</strong>
              </div>
              <div class="stat-block">
                <span>今日待复习</span>
                <strong id="dueWordCount">0</strong>
              </div>
            </div>
          </header>

          <div class="wordbook-panel">
            <div class="wordbook-search">
              <div class="search-shell">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input
                  class="source-search-input"
                  id="sourceSearchInput"
                  type="search"
                  placeholder="搜索题号、单词或释义，例如：剑12-2-2"
                  autocomplete="off"
                  aria-label="搜索题号、单词或释义"
                >
                <button class="clear-search" id="clearSearchButton" type="button" aria-label="清除搜索" hidden>×</button>
              </div>
              <p class="search-summary" id="searchSummary">输入“剑12-2-2”，可同时查看这套题的听力和阅读生词。</p>
            </div>

            <div class="wordbook-controls">
              <div class="category-tabs" role="tablist" aria-label="单词分类">
                <button
                  class="tab-button active"
                  id="listeningTab"
                  type="button"
                  role="tab"
                  aria-selected="true"
                  aria-controls="wordList"
                  data-category="listening"
                >听力</button>
                <button
                  class="tab-button"
                  id="readingTab"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="wordList"
                  data-category="reading"
                >阅读</button>
              </div>
              <button class="review-button" id="reviewButton" type="button">
                <span aria-hidden="true">▶</span>
                <span>开始复习</span>
              </button>
            </div>

            <div class="word-list" id="wordList" role="tabpanel" aria-live="polite"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-header">
        <div>
          <h2 id="modalTitle">收录不熟单词</h2>
          <p>剪贴板内容会自动尝试填入单词栏</p>
        </div>
        <button class="icon-button" id="closeAddModal" type="button" aria-label="关闭对话框">×</button>
      </header>

      <form class="modal-form" id="wordForm">
        <label class="field">
          <span class="field-label">分类</span>
          <select class="field-control" id="categoryInput" required>
            <option value="listening">听力</option>
            <option value="reading">阅读</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">
            题目编号
            <span>用于按剑桥套题归档</span>
          </span>
          <input
            class="field-control"
            id="sourceInput"
            type="text"
            maxlength="30"
            placeholder="例如：剑12-2-2"
            autocomplete="off"
            required
          >
        </label>

        <div class="field">
          <label class="field-label" for="wordInput">
            单词
            <span>自动读取剪贴板</span>
          </label>
          <div class="input-with-action">
            <input
              class="field-control"
              id="wordInput"
              type="text"
              maxlength="120"
              placeholder="例如：meticulous"
              autocomplete="off"
              required
            >
            <button class="paste-button" id="pasteButton" type="button">粘贴</button>
          </div>
          <p class="clipboard-status" id="clipboardStatus">正在尝试读取剪贴板…</p>
        </div>

        <div class="translate-row">
          <button class="translate-button" id="translateButton" type="button">
            <span class="spinner" aria-hidden="true"></span>
            <span aria-hidden="true">译</span>
            <span class="translateText">自动翻译</span>
          </button>
        </div>

        <label class="field">
          <span class="field-label">
            中文释义
            <span>可手动修改</span>
          </span>
          <textarea
            class="field-control"
            id="meaningInput"
            maxlength="500"
            placeholder="翻译结果会显示在这里"
            required
          ></textarea>
        </label>

        <button class="save-button" type="submit">保存到单词本</button>
      </form>
    </div>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="assertive" aria-atomic="true"></div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "ielts-workbench-vocabulary-v1";
      const PROFILE_KEY = "ielts-workbench-profile-v1";
      const DEFAULT_PROFILE = {
        workspaceName: "雅思备考工作台",
        avatarDataUrl: ""
      };
      const REVIEW_OFFSETS = [1, 2, 4, 7, 15];
      const CATEGORY_LABELS = {
        listening: "听力",
        reading: "阅读"
      };

      const state = {
        activeView: "practice",
        activeCategory: "listening",
        reviewOnly: false,
        searchQuery: "",
        lastSource: "",
        profile: loadProfile(),
        words: loadWords()
      };

      state.lastSource = [...state.words]
        .reverse()
        .find((word) => word.source && word.source !== "未分类")?.source || "";

      const elements = {
        navButtons: [...document.querySelectorAll("[data-view-target]")],
        views: {
          practice: document.getElementById("practiceView"),
          vocabulary: document.getElementById("vocabularyView")
        },
        avatarButton: document.getElementById("avatarButton"),
        avatarInput: document.getElementById("avatarInput"),
        avatarImage: document.getElementById("avatarImage"),
        avatarFallback: document.getElementById("avatarFallback"),
        workspaceNameText: document.getElementById("workspaceNameText"),
        practiceLinks: [...document.querySelectorAll("[data-practice-link]")],
        practiceFrame: document.getElementById("practiceFrame"),
        practiceFrameLoading: document.getElementById("practiceFrameLoading"),
        reloadPracticeButton: document.getElementById("reloadPracticeButton"),
        openAddModal: document.getElementById("openAddModal"),
        closeAddModal: document.getElementById("closeAddModal"),
        modalBackdrop: document.getElementById("modalBackdrop"),
        wordForm: document.getElementById("wordForm"),
        categoryInput: document.getElementById("categoryInput"),
        sourceInput: document.getElementById("sourceInput"),
        wordInput: document.getElementById("wordInput"),
        meaningInput: document.getElementById("meaningInput"),
        pasteButton: document.getElementById("pasteButton"),
        clipboardStatus: document.getElementById("clipboardStatus"),
        translateButton: document.getElementById("translateButton"),
        translateText: document.querySelector(".translateText"),
        tabButtons: [...document.querySelectorAll("[data-category]")],
        sourceSearchInput: document.getElementById("sourceSearchInput"),
        clearSearchButton: document.getElementById("clearSearchButton"),
        searchSummary: document.getElementById("searchSummary"),
        reviewButton: document.getElementById("reviewButton"),
        wordList: document.getElementById("wordList"),
        totalWordCount: document.getElementById("totalWordCount"),
        dueWordCount: document.getElementById("dueWordCount"),
        todayLabel: document.getElementById("todayLabel"),
        toastRegion: document.getElementById("toastRegion")
      };

      let lastFocusedElement = null;

      function loadProfile() {
        try {
          const parsed = JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}");
          return {
            workspaceName:
              typeof parsed.workspaceName === "string" && parsed.workspaceName.trim()
                ? parsed.workspaceName.trim().slice(0, 28)
                : DEFAULT_PROFILE.workspaceName,
            avatarDataUrl:
              typeof parsed.avatarDataUrl === "string" && parsed.avatarDataUrl.startsWith("data:image/")
                ? parsed.avatarDataUrl
                : ""
          };
        } catch (error) {
          console.warn("无法读取本地个性化设置：", error);
          return { ...DEFAULT_PROFILE };
        }
      }

      function saveProfile() {
        try {
          localStorage.setItem(PROFILE_KEY, JSON.stringify(state.profile));
          return true;
        } catch (error) {
          console.error("无法保存个性化设置：", error);
          showToast("个性化设置保存失败，请尝试使用更小的头像图片。", "error");
          return false;
        }
      }

      function renderProfile() {
        elements.workspaceNameText.textContent = state.profile.workspaceName;
        document.title = state.profile.workspaceName;

        if (state.profile.avatarDataUrl) {
          elements.avatarImage.src = state.profile.avatarDataUrl;
          elements.avatarImage.hidden = false;
          elements.avatarFallback.hidden = true;
        } else {
          elements.avatarImage.removeAttribute("src");
          elements.avatarImage.hidden = true;
          elements.avatarFallback.hidden = false;
        }
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("图片读取失败"));
          reader.readAsDataURL(file);
        });
      }

      function loadImage(dataUrl) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("图片格式无法识别"));
          image.src = dataUrl;
        });
      }

      async function createAvatarDataUrl(file) {
        const originalDataUrl = await readFileAsDataUrl(file);
        const image = await loadImage(originalDataUrl);
        const canvas = document.createElement("canvas");
        const size = 256;
        const sourceSize = Math.min(image.naturalWidth, image.naturalHeight);
        const sourceX = (image.naturalWidth - sourceSize) / 2;
        const sourceY = (image.naturalHeight - sourceSize) / 2;
        const context = canvas.getContext("2d");

        if (!context || !sourceSize) {
          throw new Error("图片处理失败");
        }

        canvas.width = size;
        canvas.height = size;
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, size, size);
        context.drawImage(
          image,
          sourceX,
          sourceY,
          sourceSize,
          sourceSize,
          0,
          0,
          size,
          size
        );

        return canvas.toDataURL("image/jpeg", 0.84);
      }

      async function updateAvatar(file) {
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          showToast("请选择 JPG、PNG、WebP 等图片文件。", "error");
          return;
        }
        if (file.size > 15 * 1024 * 1024) {
          showToast("图片太大，请选择小于 15MB 的图片。", "error");
          return;
        }

        elements.avatarButton.disabled = true;
        try {
          const avatarDataUrl = await createAvatarDataUrl(file);
          const previousAvatar = state.profile.avatarDataUrl;
          state.profile.avatarDataUrl = avatarDataUrl;

          if (!saveProfile()) {
            state.profile.avatarDataUrl = previousAvatar;
            return;
          }

          renderProfile();
          showToast("头像已更新！", "success");
        } catch (error) {
          console.error("头像处理失败：", error);
          showToast("头像处理失败，请换一张图片重试。", "error");
        } finally {
          elements.avatarButton.disabled = false;
          elements.avatarInput.value = "";
        }
      }

      function commitWorkspaceName() {
        const nextName = elements.workspaceNameText.textContent
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 28);

        if (!nextName) {
          elements.workspaceNameText.textContent = state.profile.workspaceName;
          showToast("工作台名称不能为空。", "error");
          return;
        }

        if (nextName === state.profile.workspaceName) {
          elements.workspaceNameText.textContent = state.profile.workspaceName;
          return;
        }

        const previousName = state.profile.workspaceName;
        state.profile.workspaceName = nextName;
        if (!saveProfile()) {
          state.profile.workspaceName = previousName;
          renderProfile();
          return;
        }

        renderProfile();
        showToast("工作台名称已更新！", "success");
      }

      function normalizeSource(value) {
        let normalized = String(value || "")
          .trim()
          .replace(/^剑桥/i, "剑")
          .replace(/[—–－_]/g, "-")
          .replace(/\s+/g, "");

        if (/^\d+(?:-\d+)+$/.test(normalized)) {
          normalized = `剑${normalized}`;
        }

        return normalized.slice(0, 30);
      }

      function normalizeSearchValue(value) {
        let normalized = String(value || "")
          .trim()
          .toLocaleLowerCase("zh-CN")
          .replace(/^剑桥/, "剑")
          .replace(/[—–－_]/g, "-")
          .replace(/\s+/g, "");

        if (/^\d+(?:-\d+)+$/.test(normalized)) {
          normalized = `剑${normalized}`;
        }

        return normalized;
      }

      function loadWords() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          if (!Array.isArray(parsed)) return [];

          return parsed
            .filter((item) =>
              item &&
              typeof item.word === "string" &&
              typeof item.meaning === "string" &&
              Object.prototype.hasOwnProperty.call(CATEGORY_LABELS, item.category) &&
              /^\d{4}-\d{2}-\d{2}$/.test(item.addedDate || "")
            )
            .map((item) => ({
              id: item.id || createId(),
              word: item.word.trim(),
              meaning: item.meaning.trim(),
              category: item.category,
              source: normalizeSource(item.source) || "未分类",
              addedDate: item.addedDate,
              createdAt: item.createdAt || `${item.addedDate}T00:00:00`
            }));
        } catch (error) {
          console.warn("无法读取本地单词数据：", error);
          return [];
        }
      }

      function saveWords() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.words));
          return true;
        } catch (error) {
          console.error("无法保存本地单词数据：", error);
          showToast("保存失败，请检查浏览器是否允许本地存储。", "error");
          return false;
        }
      }

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function localDateString(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function parseLocalDate(dateString) {
        const [year, month, day] = dateString.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function addDays(dateString, days) {
        const date = parseLocalDate(dateString);
        date.setDate(date.getDate() + days);
        return localDateString(date);
      }

      function formatChineseDate(dateString) {
        const date = parseLocalDate(dateString);
        if (Number.isNaN(date.getTime())) return dateString;
        return new Intl.DateTimeFormat("zh-CN", {
          year: "numeric",
          month: "short",
          day: "numeric"
        }).format(date);
      }

      function getReviewDates(word) {
        return REVIEW_OFFSETS.map((offset) => addDays(word.addedDate, offset));
      }

      function isDueToday(word) {
        return getReviewDates(word).includes(localDateString());
      }

      function getNextReviewLabel(word) {
        const today = localDateString();
        const nextDate = getReviewDates(word).find((date) => date >= today);

        if (!nextDate) return "本轮复习已完成";
        if (nextDate === today) return "今天";
        return formatChineseDate(nextDate);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setActiveView(viewName) {
        if (!elements.views[viewName]) return;
        state.activeView = viewName;

        Object.entries(elements.views).forEach(([name, view]) => {
          view.classList.toggle("active", name === viewName);
        });

        elements.navButtons.forEach((button) => {
          const isActive = button.dataset.viewTarget === viewName;
          button.classList.toggle("active", isActive);
          if (isActive) {
            button.setAttribute("aria-current", "page");
          } else {
            button.removeAttribute("aria-current");
          }
        });

        if (viewName === "vocabulary") {
          renderWordbook();
        }
      }

      function setCategory(category) {
        if (!CATEGORY_LABELS[category]) return;
        state.activeCategory = category;
        state.reviewOnly = false;
        state.searchQuery = "";
        elements.sourceSearchInput.value = "";
        renderWordbook();
      }

      function renderWordbook() {
        const searchQuery = normalizeSearchValue(state.searchQuery);
        const isSearching = Boolean(searchQuery);

        elements.tabButtons.forEach((button) => {
          const isActive = !isSearching && button.dataset.category === state.activeCategory;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-selected", String(isActive));
          button.tabIndex = isActive ? 0 : -1;
        });

        elements.clearSearchButton.hidden = !isSearching;
        elements.reviewButton.hidden = isSearching;
        elements.reviewButton.classList.toggle("active", state.reviewOnly);
        elements.reviewButton.innerHTML = state.reviewOnly
          ? '<span aria-hidden="true">×</span><span>退出复习</span>'
          : '<span aria-hidden="true">▶</span><span>开始复习</span>';

        const sortedWords = [...state.words]
          .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
        const categoryWords = sortedWords
          .filter((word) => word.category === state.activeCategory)
        const searchWords = isSearching
          ? sortedWords.filter((word) =>
              normalizeSearchValue(`${word.source} ${word.word} ${word.meaning}`).includes(searchQuery)
            )
          : [];

        const dueWords = categoryWords.filter(isDueToday);
        elements.totalWordCount.textContent = String(state.words.length);
        elements.dueWordCount.textContent = String(state.words.filter(isDueToday).length);

        if (isSearching) {
          elements.searchSummary.innerHTML = `找到 <strong>${searchWords.length}</strong> 个结果，已同时搜索听力和阅读。`;
          renderAllCards(searchWords, true);
        } else if (state.reviewOnly) {
          elements.searchSummary.textContent = `当前查看：${CATEGORY_LABELS[state.activeCategory]}今日待复习单词。`;
          renderReviewCards(dueWords);
        } else {
          elements.searchSummary.textContent = `当前查看：${CATEGORY_LABELS[state.activeCategory]}，单词按剑桥题号分组。`;
          renderAllCards(categoryWords, false);
        }
      }

      function createWordCardMarkup(word) {
        const due = isDueToday(word);
        return `
          <article class="word-card${due ? " due" : ""}">
            <div class="word-main">
              <h2>${escapeHtml(word.word)}</h2>
              <div class="word-badges">
                <span class="badge">${CATEGORY_LABELS[word.category]}</span>
                <span class="badge source-label">${escapeHtml(word.source)}</span>
                ${due ? '<span class="badge due-label">📢 今日待复习</span>' : ""}
              </div>
            </div>
            <div class="meaning">${escapeHtml(word.meaning)}</div>
            <div class="card-dates">
              <div class="date-row">
                <span>添加日期</span>
                <strong>${formatChineseDate(word.addedDate)}</strong>
              </div>
              <div class="date-row">
                <span>下次复习</span>
                <strong>${getNextReviewLabel(word)}</strong>
              </div>
            </div>
          </article>
        `;
      }

      function renderAllCards(words, isSearchMode) {
        elements.wordList.className = "word-list grouped-list";

        if (!words.length) {
          elements.wordList.innerHTML = `
            <div class="empty-state">
              <div>
                <div class="empty-state-icon" aria-hidden="true">${isSearchMode ? "⌕" : "Aa"}</div>
                <h2>${isSearchMode ? "没有找到匹配的单词" : `还没有${CATEGORY_LABELS[state.activeCategory]}单词`}</h2>
                <p>${isSearchMode ? "请检查题号格式，例如输入“剑12-2-2”，或尝试搜索单词和释义。" : "在刷题时点击右下角的“+”按钮，把遇到的不熟单词收录进来吧。"}</p>
              </div>
            </div>
          `;
          return;
        }

        const groupedWords = words.reduce((groups, word) => {
          const source = word.source || "未分类";
          if (!groups.has(source)) groups.set(source, []);
          groups.get(source).push(word);
          return groups;
        }, new Map());

        elements.wordList.innerHTML = [...groupedWords.entries()]
          .map(([source, sourceWords]) => `
            <section class="source-group" aria-label="${escapeHtml(source)}单词">
              <header class="source-group-header">
                <h2 class="source-group-title">${escapeHtml(source)}</h2>
                <span class="source-group-count">${sourceWords.length} 个单词</span>
              </header>
              <div class="source-card-list">
                ${sourceWords.map(createWordCardMarkup).join("")}
              </div>
            </section>
          `)
          .join("");
      }

      function renderReviewCards(words) {
        elements.wordList.className = "word-list review-grid";

        if (!words.length) {
          elements.wordList.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <div>
                <div class="empty-state-icon" aria-hidden="true">🎉</div>
                <h2>今天没有需要复习的单词，太棒了！</h2>
                <p>保持节奏，明天再来看看新的复习任务。</p>
              </div>
            </div>
          `;
          return;
        }

        elements.wordList.innerHTML = words.map((word) => `
          <article
            class="flip-card"
            tabindex="0"
            role="button"
            aria-label="${escapeHtml(word.word)}，点击查看释义"
            aria-pressed="false"
          >
            <div class="flip-card-inner">
              <div class="flip-face flip-front">
                <span class="badge due-label">📢 今日待复习</span>
                <h2>${escapeHtml(word.word)}</h2>
                <span class="badge source-label" style="margin-top: 12px;">${escapeHtml(word.source)}</span>
                <span class="flip-prompt">点击卡片查看释义</span>
              </div>
              <div class="flip-face flip-back">
                <span class="badge">${CATEGORY_LABELS[word.category]} · ${escapeHtml(word.source)}</span>
                <div class="flip-meaning">${escapeHtml(word.meaning)}</div>
                <span class="flip-prompt">再次点击翻回单词</span>
              </div>
            </div>
          </article>
        `).join("");
      }

      async function openModal(prefillWord = "") {
        lastFocusedElement = document.activeElement;
        elements.wordForm.reset();
        elements.categoryInput.value = state.activeCategory;
        elements.sourceInput.value = state.lastSource;
        elements.clipboardStatus.className = "clipboard-status";
        elements.clipboardStatus.textContent = "正在尝试读取剪贴板…";
        elements.modalBackdrop.classList.add("open");
        elements.modalBackdrop.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";

        if (typeof prefillWord === "string" && prefillWord.trim()) {
          elements.wordInput.value = prefillWord.trim().slice(0, 120);
          elements.clipboardStatus.textContent = "已自动带入刚才选中的单词。";
          elements.clipboardStatus.classList.add("success");
        } else {
          await readClipboard();
        }
        elements.wordInput.focus();
      }

      function closeModal() {
        elements.modalBackdrop.classList.remove("open");
        elements.modalBackdrop.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        setTranslationLoading(false);
        if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
          lastFocusedElement.focus();
        }
      }

      async function readClipboard() {
        elements.clipboardStatus.className = "clipboard-status";

        if (!navigator.clipboard || typeof navigator.clipboard.readText !== "function") {
          elements.clipboardStatus.textContent = "当前打开方式不支持自动读取，请直接按 Ctrl/⌘ + V 粘贴。";
          elements.clipboardStatus.classList.add("warning");
          return;
        }

        try {
          const clipboardText = (await navigator.clipboard.readText()).trim();
          if (clipboardText) {
            elements.wordInput.value = clipboardText.slice(0, 120);
            elements.clipboardStatus.textContent = "已自动读取剪贴板内容。";
            elements.clipboardStatus.classList.add("success");
          } else {
            elements.clipboardStatus.textContent = "剪贴板为空，可以在上方手动输入。";
          }
        } catch (error) {
          console.info("剪贴板读取未授权：", error);
          elements.clipboardStatus.textContent = "未获得剪贴板权限，请直接按 Ctrl/⌘ + V 粘贴。";
          elements.clipboardStatus.classList.add("warning");
        }
      }

      function setTranslationLoading(isLoading) {
        elements.translateButton.disabled = isLoading;
        elements.translateButton.classList.toggle("loading", isLoading);
        elements.translateText.textContent = isLoading ? "翻译中…" : "自动翻译";
      }

      async function translateWord() {
        const word = elements.wordInput.value.trim();
        if (!word) {
          elements.wordInput.setCustomValidity("请先输入或粘贴要翻译的单词。");
          elements.wordInput.reportValidity();
          elements.wordInput.setCustomValidity("");
          return;
        }

        setTranslationLoading(true);

        try {
          const params = new URLSearchParams({
            client: "gtx",
            sl: "en",
            tl: "zh-CN",
            dt: "t",
            q: word
          });
          const response = await fetch(`https://translate.googleapis.com/translate_a/single?${params.toString()}`);
          if (!response.ok) {
            throw new Error(`翻译服务返回状态码 ${response.status}`);
          }

          const data = await response.json();
          const translated = Array.isArray(data?.[0])
            ? data[0].map((segment) => segment?.[0] || "").join("").trim()
            : "";

          if (!translated) {
            throw new Error("翻译结果为空");
          }

          elements.meaningInput.value = translated;
          elements.meaningInput.focus();
          showToast("翻译完成，可以继续修改释义。", "success");
        } catch (error) {
          console.error("自动翻译失败：", error);
          showToast("自动翻译失败，请检查网络或手动填写释义。", "error");
          elements.meaningInput.focus();
        } finally {
          setTranslationLoading(false);
        }
      }

      function addWord(event) {
        event.preventDefault();

        const word = elements.wordInput.value.trim();
        const meaning = elements.meaningInput.value.trim();
        const category = elements.categoryInput.value;
        const source = normalizeSource(elements.sourceInput.value);

        if (!word || !meaning || !source || !CATEGORY_LABELS[category]) {
          elements.wordForm.reportValidity();
          return;
        }

        const now = new Date();
        state.words.push({
          id: createId(),
          word,
          meaning,
          category,
          source,
          addedDate: localDateString(now),
          createdAt: now.toISOString()
        });

        if (!saveWords()) {
          state.words.pop();
          return;
        }

        state.lastSource = source;
        renderWordbook();
        closeModal();
        showToast("保存成功！", "success");

        const pageParams = new URLSearchParams(window.location.search);
        if (pageParams.get("collector") === "1" && window.opener) {
          window.setTimeout(() => window.close(), 700);
        }
      }

      function showToast(message, type = "") {
        const toast = document.createElement("div");
        toast.className = `toast ${type}`.trim();
        toast.setAttribute("role", "status");
        toast.innerHTML = `<span aria-hidden="true">${type === "success" ? "✓" : type === "error" ? "!" : "•"}</span><span>${escapeHtml(message)}</span>`;
        elements.toastRegion.appendChild(toast);
        window.setTimeout(() => toast.remove(), 3200);
      }

      function toggleFlipCard(card) {
        const isFlipped = card.classList.toggle("flipped");
        card.setAttribute("aria-pressed", String(isFlipped));
        card.setAttribute(
          "aria-label",
          isFlipped ? "释义已显示，点击翻回单词" : "单词已显示，点击查看释义"
        );
      }

      elements.avatarButton.addEventListener("click", () => {
        elements.avatarInput.click();
      });

      elements.avatarInput.addEventListener("change", () => {
        updateAvatar(elements.avatarInput.files?.[0]);
      });

      elements.workspaceNameText.addEventListener("blur", commitWorkspaceName);
      elements.workspaceNameText.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          elements.workspaceNameText.blur();
        } else if (event.key === "Escape") {
          event.preventDefault();
          elements.workspaceNameText.textContent = state.profile.workspaceName;
          elements.workspaceNameText.blur();
        }
      });
      elements.workspaceNameText.addEventListener("paste", (event) => {
        event.preventDefault();
        const pastedText = (event.clipboardData?.getData("text/plain") || "")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 28);
        elements.workspaceNameText.textContent = pastedText;
      });

      elements.practiceLinks.forEach((link) => {
        link.addEventListener("click", () => {
          showToast("已在新窗口打开新东方题库。", "success");
        });
      });

      elements.practiceFrame.addEventListener("load", () => {
        elements.practiceFrameLoading.classList.add("loaded");
      });

      elements.reloadPracticeButton.addEventListener("click", () => {
        elements.practiceFrameLoading.classList.remove("loaded");
        elements.practiceFrame.src = "https://ieltscat.xdf.cn/?dt_dapp=1&reload=" + Date.now();
        showToast("正在重新加载题库。");
      });

      elements.sourceInput.addEventListener("blur", () => {
        elements.sourceInput.value = normalizeSource(elements.sourceInput.value);
      });

      elements.sourceSearchInput.addEventListener("input", () => {
        state.searchQuery = elements.sourceSearchInput.value;
        state.reviewOnly = false;
        renderWordbook();
      });

      elements.clearSearchButton.addEventListener("click", () => {
        state.searchQuery = "";
        elements.sourceSearchInput.value = "";
        renderWordbook();
        elements.sourceSearchInput.focus();
      });

      elements.navButtons.forEach((button) => {
        button.addEventListener("click", () => setActiveView(button.dataset.viewTarget));
      });

      elements.tabButtons.forEach((button) => {
        button.addEventListener("click", () => setCategory(button.dataset.category));
      });

      elements.reviewButton.addEventListener("click", () => {
        state.reviewOnly = !state.reviewOnly;
        renderWordbook();
      });

      elements.openAddModal.addEventListener("click", () => openModal());
      elements.closeAddModal.addEventListener("click", closeModal);
      elements.pasteButton.addEventListener("click", readClipboard);
      elements.translateButton.addEventListener("click", translateWord);
      elements.wordForm.addEventListener("submit", addWord);

      elements.modalBackdrop.addEventListener("click", (event) => {
        if (event.target === elements.modalBackdrop) closeModal();
      });

      elements.wordList.addEventListener("click", (event) => {
        const card = event.target.closest(".flip-card");
        if (card) toggleFlipCard(card);
      });

      elements.wordList.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest(".flip-card");
        if (!card) return;
        event.preventDefault();
        toggleFlipCard(card);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && elements.modalBackdrop.classList.contains("open")) {
          closeModal();
        }
      });

      elements.todayLabel.textContent = new Intl.DateTimeFormat("zh-CN", {
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(new Date());

      renderProfile();
      renderWordbook();

      const incomingParams = new URLSearchParams(window.location.search);
      const incomingWord = (incomingParams.get("word") || "").trim().slice(0, 120);
      const incomingCategory = incomingParams.get("category") || "";
      const incomingSource = normalizeSource(incomingParams.get("source") || "");
      if (incomingParams.get("collector") === "1" && incomingWord) {
        window.setTimeout(async () => {
          await openModal(incomingWord);
          if (CATEGORY_LABELS[incomingCategory]) {
            elements.categoryInput.value = incomingCategory;
          }
          if (incomingSource) {
            elements.sourceInput.value = incomingSource;
          }
          if (incomingParams.get("auto") === "1") {
            await translateWord();
          }
        }, 0);
      }
    })();
  </script>
</body>
</html>
